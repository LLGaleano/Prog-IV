<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/global.css"/>
    <link rel="stylesheet" href="css/cursos.css"/>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cursos.js" defer></script>
</head>

<body>
    <header class="header-principal"> 
        <div class="logo-img hd">
            <img src="img/Fcad-Logo.png" alt="logo de la Facultad">
        </div>
        <div class="titulo hd">
            <h1>Cursos</h1>
        </div>
        <div class="icono-perfil hd">
            <div class="icono-perfil2">
                <i class="bx bx-user"></i>
                <span id="usuarioLogueado">Usuario</span>
            </div>
        </div>
    </header>
    <div class="contenedor-principal">
        <aside class="contenedor-nav">

            <nav>
                <ul class="lista-principal">
                    <li><a class="link-nav" href="index.html">Inicio</a></li>
                    <li><a class="link-nav" href="cursos.html">Cursos</a></li>
                    <li><a class="link-nav" href="estudiantes.html">Estudiantes</a></li>
                    <li><a class="link-nav" href="inscriptos.html">Inscriptos</a></li>
                </ul>
            </nav>
        
            <div class="logout-container">
                <a href="#" id="btnLogout" class="link-nav logout-link">
                    Cerrar sesión
                </a>
            </div>
        
        </aside>
        <main>
            <div class="encabezado">
                <h2>Listado de cursos</h2>
                <a href="cursos-nuevo.html" class="btn-agregar">+ Nuevo Curso</a>
            </div>
            <div class="herramienta">
                <input type="text" class="buscador" placeholder="Buscar por nombre"/>
            </div>
            
            <div class="contenedor-tabla">
                <table class="tabla-cursos">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Fecha Inicio</th>
                            <th>Inscriptos</th>
                            <th>Cupo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbody">
                        <tr>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="contenedor-paginacion">
                <button id="btn-ant" class="btn-pagi">
                    <i class="bx bx-chevron-left"></i> Anterior
                </button>
                <span id="info-paginacion">Página 1 de 1</span>
                <button id="btn-sig" class="btn-pagi">
                    Siguiente <i class="bx bx-chevron-right"></i>
                </button>
            </div>
        </main>
</div> 
    <dialog id="modal-curso" class="modal-principal">
        <div class="modal-header">
            <h3 id="modal-titulo">Detalles del Curso</h3>
            <button id="btn-cerrar-modal" class="btn-cerrar-modal" onclick="cerrarModal()">&times;</button>
        </div>
        
        <div class="modal-body">
            <div class="campo">
                <label>Nombre del Curso</label>
                <input type="text" id="modalNombre" readonly required>
            </div>
            
            <div class="campo">
                <label>Descripción</label>
                <textarea id="modalDesc" readonly rows="3" style="resize: none;" required></textarea>
            </div>
            
            <div style="display: flex; gap: 15px;">
                <div class="campo" style="flex: 1;">
                    <label>ID Curso</label>
                    <input type="text" id="modalId" readonly>
                </div>
                <div class="campo" style="flex: 1;">
                    <label>Fecha de Inicio</label>
                    <input type="date" id="modalFecha" readonly required>
                </div>
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="campo" style="flex: 1;">
                    <label>Cant. Horas</label>
                    <input type="number" id="modalHoras" readonly required>
                </div>
                <div class="campo" style="flex: 1;">
                    <label>Cupo Máx.</label>
                    <input type="number" id="modalCupo" readonly required>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button id="btn-guardar-modal" class="btn-guardar-modal oculto" onclick="guardarEdicionCurso()">Guardar Cambios</button>
            <button class="btn-cancelar" onclick="cerrarModal()" style="margin-left: 15px;">Cerrar</button>
        </div>
    </dialog>
</body>

</html>
