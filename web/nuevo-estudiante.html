<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Nuevo Estudiante</title>
    
    <link rel="stylesheet" href="css/global.css"/>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_blue.css">

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script> 
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/nuevo-estudiante.js" defer></script>
</head>
<body>
    <header class="header-principal"> 
        <div class="logo-img hd">
            <img src="img/Fcad-Logo.png" alt="logo de la Facultad">
        </div>
        <div class="titulo hd">
            <h1>Cursos</h1>
        </div>
        <div class="icono-perfil hd">
            <div class="icono-perfil2">
                <i class="bx bx-user"></i>
                <span id="usuarioLogueado">Usuario</span>
            </div>
        </div>
    </header>
    <div class="contenedor-principal">
        <aside class="contenedor-nav">

            <nav>
                <ul class="lista-principal">
                    <li><a class="link-nav" href="index.html">Inicio</a></li>
                    <li><a class="link-nav" href="cursos.html">Cursos</a></li>
                    <li><a class="link-nav" href="estudiantes.html">Estudiantes</a></li>
                    <li><a class="link-nav" href="inscriptos.html">Inscriptos</a></li>
                </ul>
            </nav>
        
            <div class="logout-container">
                <a href="#" id="btnLogout" class="link-nav logout-link">
                    Cerrar sesión
                </a>
            </div>
        
        </aside>


        <main class="main-formulario">
            <div class="formulario-contenedor">
                <div class="header-form">
                    <h2>Registrar Nuevo Alumno</h2>
                    <p>Complete los campos para registrar un estudiante.</p>
                </div>
                <form id="formNuevoAlumno" class="cuerpo-formulario" novalidate>
                    <div class="fila-campos">
                        <div class="campo-grupo">
                            <label for="inputDocumento">Documento</label>
                            <input type="text" id="inputDocumento" required>
                            <span id="error-documento" class="error-mensaje"></span>
                        </div>
                    </div>
                    <div class="fila-campos">
                        <div class="campo-grupo">
                            <label for="inputNombres">Nombres</label>
                            <input type="text" id="inputNombres" required>
                            <span id="error-nombres" class="error-mensaje"></span>
                        </div>
                    </div>
                    <div class="fila-campos">
                        <div class="campo-grupo">
                            <label for="inputApellido">Apellido</label>
                            <input type="text" id="inputApellido" required>
                            <span id="error-apellido" class="error-mensaje"></span>
                        </div>
                    </div>
                    <div class="fila-campos">
                        <div class="campo-grupo">
                            <label for="inputEmail">Email</label>
                            <input type="email" id="inputEmail" required>
                            <span id="error-email" class="error-mensaje"></span>
                        </div>
                    </div>
                    <div class="fila-campos">
                        <div class="campo-grupo">
                            <label for="inputFechaNac">Fecha de Nacimiento:</label>
                            <input type="text" id="inputFechaNac" placeholder="Seleccione fecha..." required>
                            <span id="error-fecha_nacimiento" class="error-mensaje"></span>
                        </div>
                    </div>
                    <div class="acciones-formulario">
                        <a href="estudiantes.html" class="btn-cancelar">Cancelar y Volver</a>
                        <button type="submit" id="btnGuardar" class="btn-guardar">
                            <i class='bx bx-save'></i>Guardar Estudiante
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>

</html>
