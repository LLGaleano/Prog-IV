<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nuevo-estudiante</title>
    <script src="js/nuevo-estudiante.js" defer></script>
</head>
<body>

    <div>
        <h2>Registrar Nuevo Alumno</h2>
        
        <form id="formNuevoAlumno">
            <div>
                <label>Documento:</label>
                <input type="text" id="inputDocumento" required>
            </div>
            <div>
                <label>Nombres:</label>
                <input type="text" id="inputNombres" required>
            </div>
            <div>
                <label>Apellido:</label>
                <input type="text" id="inputApellido" required>
            </div>
            <div>
                <label>Email:</label>
                <input type="email" id="inputEmail" required>
            </div>
            <div>
                <label>Fecha de Nacimiento:</label>
                <input type="date" id="inputFechaNac" required>
            </div>

            <button type="submit">Guardar Estudiante</button>
            <a href="estudiantes.html">Cancelar y Volver</a>
        </form>
    </div>
</body>

</html>
