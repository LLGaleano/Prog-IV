<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/global.css"/>
    <link rel="stylesheet" href="css/estudiantes.css"/>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <script src="js/estudiantes.js" type="module" defer></script>
</head>
<body>
    <header class="header-principal"> 
        <div class="logo-img hd">
            <img src="img/Fcad-Logo.png" alt="logo de la Facultad">
        </div>
        <div class="titulo hd">
            <h1>Estudiantes</h1>
        </div>
        <div class="icono-perfil hd">
            <div class="icono-perfil2">
                <i class="bx bx-user"></i>
                <span>Usuario123</span>
            </div>
        </div>
    </header>
    <div class="contenedor-principal">
        <aside class="contenedor-nav">
            <nav>
                <ul class="lista-principal">
                    <li><a class="link-nav" href="index.html">Inicio</a></li>
                    <li><a class="link-nav" href="cursos.html">Cursos</a></li>
                    <li><a class="link-nav" href="#">Estudiantes</a></li>
                    <li><a class="link-nav" href="inscriptos.html">Inscriptos</a></li>
                </ul>
            </nav>
        </aside>
        <main>
            <div class="encabezado">
                <h2>Listado de Estudiantes</h2>
                <a href="nuevo-estudiante.html" class="btn-agregar">+ Nuevo Estudiante</a>
            </div>
            <div class="herramienta">
                <input type="text" class="buscador" placeholder="Buscar por DNI o apellido"/>
            </div>
            <div class="contenedor-tabla">
                <table class="tabla-estudiantes">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>DNI</th>
                            <th>Apellido</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Fecha nacimiento</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbody">
                        <tr>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="contenedor-paginacion">
                <button id="btn-ant" class="btn-pagi"><i class="bx bx-chevron-left"></i> Anterior</button>
                <span id="info-paginacion">Página 1 de 1</span>
                <button id="btn-sig" class="btn-pagi">Siguiente <i class="bx bx-chevron-right"></i></button>
            </div>
        
        </main>
</div>
        
    <dialog id="modal-estudiante" class="modal-principal">
        <div class="modal-header">
            <h3 id="modal-titulo">Detalles del Estudiante</h3>
            <button id="btn-cerrar-modal" class="btn-cerrar-modal">&times;</button>
        </div>
        <form id="form-estudiante" method="dialog">
            <div class="modal-body">
                <input type="hidden" id="modal-id"/>
                <div class="campo">
                    <label>DNI</label>
                    <input type="text" id="modal-dni" required>
                </div>
                <div class="campo">
                    <label>Apellido</label>
                    <input type="text" id="modal-apellido" required>
                </div>
                <div class="campo">
                    <label>Nombres</label>
                    <input type="text" id="modal-nombres" required>
                </div>
                <div class="campo">
                    <label>Email</label>
                    <input type="email" id="modal-email" required>
                </div>
                <div class="campo">
                    <label>Fecha Nac.:</label>
                    <input type="date" id="modal-fecha" required>
                </div>
                <div class="modal-botones">
                    <button type="submit" id="btn-guardar-modal" class="btn-guardar-modal">Guardar Cambios</button>
                </div>
            </div>
        </form>
    </dialog>
</body>
</html>
