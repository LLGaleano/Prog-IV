<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscriptos</title>
    <link rel="stylesheet" href="css/global.css"/>
    <link rel="stylesheet" href="css/inscriptos.css"/>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <script src="js/auth.js"></script>
    <script src="js/inscriptos.js" type="module" defer></script>
    <script src="js/ui.js"></script>
    
</head>
<body>
    <header class="header-principal"> 
        <div class="logo-img hd">
            <img src="img/Fcad-Logo.png" alt="logo de la Facultad">
        </div>
        <div class="titulo hd">
            <h1>Inscriptos</h1>
        </div>
        <div class="icono-perfil hd">
            <div class="icono-perfil2">
                <i class="bx bx-user"></i>
                <span id="usuarioLogueado">Usuario</span>
            </div>
        </div>
    </header>
    <div class="contenedor-principal">
        <aside class="contenedor-nav">

            <nav>
                <ul class="lista-principal">
                    <li><a class="link-nav" href="index.html">Inicio</a></li>
                    <li><a class="link-nav" href="cursos.html">Cursos</a></li>
                    <li><a class="link-nav" href="estudiantes.html">Estudiantes</a></li>
                    <li><a class="link-nav" href="#">Inscriptos</a></li>
                </ul>
            </nav>
        
            <div class="logout-container">
                <a href="#" id="btnLogout" class="link-nav logout-link">
                    Cerrar sesión
                </a>
            </div>
        
        </aside>
        <main>
            <div class="encabezado">
                <h2>Listado de Inscripciones</h2>
                <a href="nueva-inscripcion.html" class="btn-agregar">+ Nueva Inscripción</a>
            </div>
            <div class="herramienta">
                <input type="text" class="buscador" placeholder="Buscar por DNI de estudiante o ID de curso..."/>
            </div>
            <div class="contenedor-tabla">
                <table class="tabla-inscriptos">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Curso</th>
                            <th>Estudiante</th>
                            <th>DNI</th>
                            <th>Fecha Inscripción</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbody">
                        <tr>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="contenedor-paginacion">
                <button id="btn-ant" class="btn-pagi"><i class="bx bx-chevron-left"></i> Anterior</button>
                <span id="info-paginacion">Página 1 de 1</span>
                <button id="btn-sig" class="btn-pagi">Siguiente <i class="bx bx-chevron-right"></i></button>
            </div>
        
        </main>
    </div>
        
    <dialog id="modal-inscripcion" class="modal-principal">
        <div class="modal-header">
            <h3 id="modal-titulo">Detalles de la Inscripción</h3>
            <button id="btn-cerrar-modal" class="btn-cerrar-modal">&times;</button>
        </div>
        <form id="form-inscripcion" method="dialog">
            <div class="modal-body">
                <div class="campo">
                    <label>ID Inscripción</label>
                    <input type="text" id="modal-id" disabled>
                </div>
                <div class="campo">
                    <label>Curso</label>
                    <input type="text" id="modal-curso" disabled>
                </div>
                <div class="campo">
                    <label>Estudiante</label>
                    <input type="text" id="modal-estudiante" disabled>
                </div>
                <div class="campo">
                    <label>DNI Estudiante</label>
                    <input type="text" id="modal-dni" disabled>
                </div>
                <div class="campo">
                    <label>Fecha de Inscripción</label>
                    <input type="text" id="modal-fecha" disabled>
                </div>
                <div class="campo">
                    <label>Estado</label>
                    <input type="text" id="modal-estado" disabled>
                </div>
                <div class="campo">
                    <label>Usuario Modificación (ID)</label>
                    <input type="text" id="modal-usuario-modif" disabled>
                </div>
                <div class="campo">
                    <label>Fecha Modificación</label>
                    <input type="text" id="modal-fecha-modif" disabled>
                </div>
            </div>
        </form>
    </dialog>
</body>
</html>
