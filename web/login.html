<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/global.css"/>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <script src="js/login.js" defer></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    
</head>
<body>
    <header class="header-principal"> 
        <div class="logo-img hd">
            <img src="img/Fcad-Logo.png" alt="logo de la Facultad">
        </div>
        <div class="titulo hd">
            <h1>Iniciar sesión</h1>
        </div>
        <div class="icono-perfil hd">
            
        </div>
    </header>
        <main class="main-formulario">
                <div id="error" class="alert alert-danger" style="display: none; margin: 20px 30px 0 30px;" role="alert"></div>
            
                <form id="loginForm" class="cuerpo-formulario" novalidate>
            
                    <div class="campo-grupo">
                        <label for="username">Usuario:</label>
                        <input type="text" id="username" name="username" required>
                    </div>
            
                    <div class="campo-grupo">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
            
                    <div class="acciones-formulario">
                        <button type="submit" class="btn-guardar">
                            Ingresar
                        </button>
                    </div>
            
                </form>
            </main>
            
        </main>
    
    <footer>

    </footer>
</body>

</html>
